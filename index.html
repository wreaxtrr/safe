<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сейф — прототип</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #fafafa; --card: #ffffff; --text: #222222; --muted: #777777; --line: #cccccc;
  --green: #1a7f37; --orange: #9a5b00; --red: #c62828;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1b; --card: #242424; --text: #e6e6e6; --muted: #9a9a9a; --line: #444444;
    --green: #5cc16f; --orange: #e0a040; --red: #ef6b6b;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1b; --card: #242424; --text: #e6e6e6; --muted: #9a9a9a; --line: #444444;
  --green: #5cc16f; --orange: #e0a040; --red: #ef6b6b;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; font-size: 15px; }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 0 0 10px; }
p { margin: 6px 0; }
.cols { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
.col { flex: 1 1 300px; min-width: 0; background: var(--card); border: 1px solid var(--line); padding: 12px; }
label { display: block; margin: 8px 0 2px; font-size: 14px; }
input, select { width: 100%; padding: 5px; font: inherit; background: var(--card); color: var(--text); border: 1px solid var(--line); }
button { font: inherit; padding: 5px 10px; margin: 4px 4px 4px 0; cursor: pointer; background: var(--bg); color: var(--text); border: 1px solid var(--line); }
.muted { color: var(--muted); font-size: 13px; }
.ok { color: var(--green); }
.warn { color: var(--orange); }
.err { color: var(--red); }
.code { font-family: monospace; font-size: 26px; letter-spacing: 4px; }
.link { word-break: break-all; }
.log { font-size: 13px; padding-left: 18px; max-height: 300px; overflow-y: auto; }
.log li { margin-bottom: 4px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
</style>
</head>
<body>
<h1>Сейф — безопасная сделка с рук</h1>
<div class="muted" id="top"></div>

<div class="cols">
  <div class="col" id="p-main"></div>
  <div class="col" id="p-contract"></div>
</div>

<script>
const STATUS = {
  created: 'ждёт резерва',
  reserved: 'деньги в сейфе',
  refusal: 'покупатель отказался',
  dispute: 'спор',
  done: 'завершена',
  refunded: 'деньги возвращены',
  cancelled: 'отменена'
};

const EVENTS = {
  created: 'сделка создана',
  reserved: 'деньги зарезервированы',
  wrong_code: 'неверный код',
  released: 'деньги ушли продавцу',
  refused: 'покупатель отказался',
  refund_agreed: 'возврат по согласию',
  dispute: 'открыт спор',
  dispute_auto: 'спор: много неверных кодов',
  dispute_buyer: 'спор решён в пользу покупателя',
  dispute_seller: 'спор решён в пользу продавца',
  expired: 'срок истёк, автовозврат',
  cancelled: 'сделка отменена'
};

const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

const $ = s => document.querySelector(s);
const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';

function fmtTime(t) {
  const d = new Date(t);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${hh}:${mm}`;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

let token = localStorage.getItem('seif-token');
const dealId = new URLSearchParams(location.search).get('deal');
let me = null;
let deal = null;
let events = [];
let code = '';
let error = '';


// ---- сервер ----

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      'x-token': token || '',
      'x-admin-key': localStorage.getItem('seif-admin') || ''
    },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await r.json();
  if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'проверьте введённые данные');
  return data;
}

async function load() {
  if (!token) return;
  me = await api('GET', '/me');
  if (dealId) {
    deal = await api('GET', '/deals/' + dealId);
    events = await api('GET', `/deals/${dealId}/events`);
  }
}

function openDeal(id) {
  location.href = id ? '?deal=' + id : location.pathname;
}


// ---- экраны ----

function dealLine(d) {
  return `<p><b>${esc(d.item)}</b>, ${rub(d.price)}<br><span class="muted">сделка №${d.id}, статус: ${STATUS[d.status]}</span></p>`;
}

function loginView() {
  return `<h2>Вход</h2>
    <label>Ваше имя</label><input id="f-name" maxlength="50">
    <p><button data-act="login">Войти</button></p>
    <p class="muted">для демо на кошелёк начислят ${rub(50000)}</p>`;
}

function homeView() {
  return `<h2>Продать</h2>
    <label>Товар</label><input id="f-item" value="PlayStation 5" maxlength="60">
    <label>Цена, ₽</label><input id="f-price" type="number" min="100" step="100" value="30000">
    <label>Срок после резерва</label>
    <select id="f-hours"><option value="24">24 ч</option><option value="48">48 ч</option><option value="72">72 ч</option></select>
    <p><button data-act="create">Создать сделку</button></p>
    <hr><h2>Купить</h2>
    <label>Номер сделки</label><input id="f-deal" maxlength="8">
    <p><button data-act="open">Открыть</button></p>`;
}

function sellerView() {
  const d = deal;
  let h = `<h2>Продавец</h2>` + dealLine(d);

  if (d.status === 'created') {
    h += `<p>ссылка для покупателя:<br><code class="link">${esc(location.href)}</code></p>
      <p class="warn">деньги ещё не в сейфе, товар не отдавать</p>
      <button data-act="cancel">Отменить</button>`;
  }
  if (d.status === 'reserved') {
    h += `<p class="ok">деньги в сейфе: ${rub(d.price)}</p>
      <p>введите код покупателя после передачи товара</p>
      <input id="f-code" inputmode="numeric" maxlength="6" placeholder="код">
      <p><button data-act="code">Подтвердить</button></p>
      <p class="muted">если код не введён до ${fmtTime(d.expires_at)}, деньги вернутся покупателю</p>`;
  }
  if (d.status === 'refusal') {
    h += `<p class="warn">покупатель отказался</p>
      <button data-act="accept-refusal">Согласен, вернуть деньги</button>
      <button data-act="dispute">Не согласен, спор</button>`;
  }
  if (d.status === 'dispute') h += `<p class="warn">спор у банка, деньги заморожены</p>`;
  if (d.status === 'done') h += `<p class="ok">получено +${rub(d.price)}</p>`;
  if (['done', 'refunded', 'cancelled'].includes(d.status)) h += `<p><button data-act="home">Новая сделка</button></p>`;
  return h;
}

function buyerView() {
  const d = deal;
  let h = `<h2>Покупатель</h2>` + dealLine(d);

  if (d.status === 'created') {
    h += `<p>деньги уйдут продавцу только по вашему коду</p>
      <button data-act="reserve">Зарезервировать ${rub(d.price)}</button>`;
  }
  if (d.status === 'reserved') {
    h += code
      ? `<p>код для продавца:</p><p class="code">${code}</p>`
      : `<p><button data-act="show-code">Проверил товар, показать код</button></p>`;
    h += `<button data-act="refuse">Отказаться от покупки</button>`;
  }
  if (d.status === 'refusal') h += `<p class="warn">ждём ответа продавца</p>`;
  if (d.status === 'dispute') h += `<p class="warn">спор у банка</p>`;
  if (d.status === 'done') h += `<p class="ok">покупка завершена</p>`;
  if (d.status === 'refunded') h += `<p class="ok">деньги вернулись +${rub(d.price)}</p>`;
  if (d.status === 'cancelled') h += `<p class="muted">продавец отменил сделку</p>`;
  if (['done', 'refunded', 'cancelled'].includes(d.status)) h += `<p><button data-act="home">На главную</button></p>`;
  return h;
}

function mainView() {
  if (!me) return loginView();
  if (!deal) return homeView();
  if (me.id === deal.seller_id) return sellerView();
  if (me.id === deal.buyer_id || deal.status === 'created') return buyerView();
  return dealLine(deal) + `<p class="muted">у сделки уже есть покупатель</p>`;
}

function contractView() {
  const d = deal;
  let h = `<h2>Контракт</h2>
    <p>статус: <b>${d ? STATUS[d.status] : 'нет сделки'}</b></p>
    <ol style="padding-left:18px;font-size:14px">
      <li>при резерве деньги блокируются</li>
      <li>продавцу - только по коду покупателя</li>
      <li>не ввели код до срока - возврат покупателю</li>
      <li>отказ - возврат с согласия продавца или спор</li>
    </ol>`;
  if (!d) return h;

  h += `<hr><p><b>Журнал</b></p>
    <ul class="log">${events.map(e => `<li>${fmtTime(e.created_at)} - ${EVENTS[e.type]}</li>`).reverse().join('')}</ul>
    <hr><p><b>Банк (демо)</b></p>
    <input id="f-admin" type="password" placeholder="ключ администратора">
    <button data-act="save-key">Сохранить ключ</button>`;

  if (d.status === 'dispute') {
    h += `<p>решение по спору:</p>
      <button data-act="win-buyer">вернуть покупателю</button>
      <button data-act="win-seller">отдать продавцу</button>`;
  }
  if (d.status === 'reserved' || d.status === 'refusal') {
    h += `<p><button data-act="expire">Срок истёк</button></p>`;
  }
  return h;
}

function render() {
  $('#top').innerHTML = me
    ? `вы: <b>${esc(me.name)}</b> · кошелёк: ${rub(me.balance)} · <button data-act="logout">выйти</button>`
    : 'цифровой рубль эмулируется';
  $('#p-main').innerHTML = (error ? `<p class="err">${esc(error)}</p>` : '') + mainView();
  $('#p-contract').innerHTML = contractView();
}


// ---- клики ----

async function act(name) {
  const url = '/deals/' + dealId;

  switch (name) {
    case 'login': {
      const user = await api('POST', '/users', { name: $('#f-name').value.trim() });
      token = user.token;
      localStorage.setItem('seif-token', token);
      break;
    }
    case 'logout':
      localStorage.removeItem('seif-token');
      openDeal('');
      break;
    case 'create': {
      const d = await api('POST', '/deals', {
        item: $('#f-item').value.trim(),
        price: Math.round(+$('#f-price').value),
        hours: +$('#f-hours').value
      });
      openDeal(d.id);
      break;
    }
    case 'open': openDeal($('#f-deal').value.trim().toUpperCase()); break;
    case 'home': openDeal(''); break;
    case 'reserve': await api('POST', url + '/reserve'); break;
    case 'show-code': code = (await api('GET', url + '/code')).code; break;
    case 'code': await api('POST', url + '/confirm', { code: $('#f-code').value.trim() }); break;
    case 'refuse': await api('POST', url + '/refuse'); break;
    case 'accept-refusal': await api('POST', url + '/accept-refusal'); break;
    case 'dispute': await api('POST', url + '/dispute'); break;
    case 'cancel': await api('POST', url + '/cancel'); break;
    case 'save-key': localStorage.setItem('seif-admin', $('#f-admin').value.trim()); break;
    case 'win-buyer': await api('POST', `/admin${url}/resolve`, { to_buyer: true }); break;
    case 'win-seller': await api('POST', `/admin${url}/resolve`, { to_buyer: false }); break;
    case 'expire': await api('POST', `/admin${url}/expire-now`); break;
  }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  error = '';
  try {
    await act(b.dataset.act);
    await load();
  } catch (err) {
    error = err.message;
  }
  render();
});

async function start() {
  try {
    await load();
  } catch (e) {
    if (e.message === 'Неизвестный токен') {
      localStorage.removeItem('seif-token');
      token = null;
    } else {
      error = e.message;
    }
  }
  render();
}

// раз в 3 секунды подтягиваем действия второй стороны, но не мешаем вводить код
setInterval(async () => {
  if (!dealId || document.activeElement.tagName === 'INPUT') return;
  try {
    await load();
    render();
  } catch (e) {}
}, 3000);

start();
</script>
</body>
</html>
